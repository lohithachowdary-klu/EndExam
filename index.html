<!DOCTYPE html>
<html>
<head>
    <title>KL University</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>KL University</h1>
        <p>Knowledge is Power</p>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <a href="#">Home</a>
        <a href="#courses">Courses</a>
        <a href="#contact">Contact</a>
        <a href="#">About</a>
    </nav>

    <!-- Banner -->
    <section class="banner">
        <h2>Welcome to KL University</h2>
        <p>Build Your Future With Quality Education</p>
        <button>Explore Courses</button>
    </section>

    <!-- Courses Table -->
    <section id="courses">
        <h2>Our Courses</h2>

        <table>
            <tr>
                <th>Course</th>
                <th>Duration</th>
                <th>Fees</th>
            </tr>

            <tr>
                <td>B.Tech</td>
                <td>4 Years</td>
                <td>₹80,000</td>
            </tr>

            <tr>
                <td>MBA</td>
                <td>2 Years</td>
                <td>₹60,000</td>
            </tr>

            <tr>
                <td>BCA</td>
                <td>3 Years</td>
                <td>₹40,000</td>
            </tr>
        </table>
    </section>

    <!-- Contact Form -->
    <section id="contact">
        <h2>Contact Us</h2>

        <form>
            <label>Name:</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email:</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Message:</label>
            <textarea placeholder="Enter your message"></textarea>

            <button type="submit">Submit</button>
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 KL University. All Rights Reserved.</p>
    </footer>

</body>
</html>
